<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=overlays-content" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="description" content="Always-on Command Center for TV" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <title>Command Center</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <main class="panel">
      <section class="col col-left">
        <header class="logo" tabindex="-1">
          <img width="32" height="32" src="icons/icon.svg" alt="Command Center" class="logo-mark">
          <span class="logo-name">
            <div>COMMAND</div>
            <div>CENTER</div>
          </span>
        </header>

        <div class="widget" id="clock-weather">
          <p class="date" id="date"></p>
          <p class="time" id="time"></p>
          <p class="wx-line">
            <span id="wx-temp">--</span>
            <span id="wx-cond">—</span>
          </p>
        </div>

        <div class="streaks" id="streaks"></div>
      </section>

      <section class="col col-right">
        <h1 class="todo-label">TODO</h1>
        <ul class="todos" id="todos"></ul>
      </section>
    </main>

    <div class="dock">
      <div class="logs">
        <div class="last-action" id="last-action">
          <div class="dock-line" id="last-reason"></div>
          <div class="dock-line" id="last-output"></div>
        </div>
        <p class="dock-line" id="needle-status">NEEDLE  LOADING</p>
      </div>
      <nav class="actions">
        <button type="button" id="open-cmd">COMMAND</button>
        <button type="button" id="open-task">ADD TASK</button>
        <button type="button" id="open-settings">SETTINGS</button>
      </nav>
    </div>

    <div class="settings-root" id="settings-root" hidden>
      <aside class="settings" id="settings">
        <p class="settings-title">SETTINGS</p>
        <button type="button" id="set-add-streak">ADD NEW STREAK</button>
        <button type="button" id="set-del-streak">DELETE STREAK</button>
        <div class="settings-pick" id="streak-pick" hidden></div>
        <button type="button" id="set-clear-todos">CLEAR COMPLETED TODOS</button>
        <button type="button" id="set-reload">FORCE RELOAD</button>
        <button type="button" id="set-reset">RESET DATA</button>
        <button type="button" id="set-close">CLOSE</button>
      </aside>
    </div>
    <div class="overlay" id="cmd-overlay" hidden>
      <form class="overlay-form" id="overlay-form">
        <p class="overlay-label" id="overlay-label">COMMAND</p>
        <textarea
          id="overlay-cmd"
          rows="1"
          maxlength="400"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          enterkeyhint="done"
          aria-label="Input"
        ></textarea>
      </form>
      <p class="overlay-wait" id="overlay-wait" hidden>PROCESSING REQUEST</p>
    </div>

    <script src="needle/needle.js"></script>
    <script src="engine.js"></script>
    <script src="app.js"></script>
  </body>
</html>
